[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exxploit"
version = "1.0.0"
description = "High-evasion XSS payload toolkit and C2 framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "HACKThief"}
]
keywords = ["xss", "security", "pentest", "payload", "c2", "red-team"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "flask>=3.0.0",
    "flask-limiter>=3.0.0",
    "waitress>=3.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
exxploit = "exxploit.cli:app"

[project.urls]
Homepage = "https://github.com/Xfactum/exxploit"
Documentation = "https://github.com/Xfactum/exxploit#readme"
Source = "https://github.com/Xfactum/exxploit"
Tracker = "https://github.com/Xfactum/exxploit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["exxploit*"]

[tool.setuptools.package-data]
exxploit = ["*.js", "config/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
